services:
  - type: web
    name: youtube-downloader-python
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && curl -L https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-linux-x64 -o ffmpeg && chmod +x ffmpeg
    startCommand: gunicorn app:app
    envVars:
      - key: PORT
        value: 10000
      # Optional: path to a Netscape-format cookies file for YouTube authentication.
      # How to obtain cookies: export them from your browser using a browser extension
      # (e.g. "Get cookies.txt LOCALLY") and upload the file as a Render Secret File
      # (Dashboard → your service → Environment → Secret Files). Then set this variable
      # to the mount path of that secret file (e.g. /etc/secrets/cookies.txt).
      # See https://github.com/yt-dlp/yt-dlp/wiki/FAQ#how-do-i-pass-cookies-to-yt-dlp
      - key: YOUTUBE_COOKIES_FILE
        value: ""
      # Optional: Proof of Origin (PO) token for YouTube bot-detection bypass.
      # This is required on server environments where YouTube bot-detection is strict.
      # Format: "web+<token>" or just "<token>" (web+ prefix added automatically).
      # How to obtain: https://github.com/yt-dlp/yt-dlp/wiki/Extractors#youtube
      - key: YOUTUBE_PO_TOKEN
        value: ""
      # Optional: visitor_data string paired with the PO token above.
      # Obtain from the same source as YOUTUBE_PO_TOKEN.
      - key: YOUTUBE_VISITOR_DATA
        value: ""
